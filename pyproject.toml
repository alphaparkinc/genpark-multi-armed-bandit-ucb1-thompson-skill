[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-multi-armed-bandit-ucb1-thompson-skill"
version = "1.0.0"
description = "Multi-armed bandit decision engine with Upper Confidence Bound 1 (UCB1) and Bayesian Thompson Sampling."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-multi-armed-bandit-ucb1-thompson-skill"
Repository = "https://github.com/alphaparkinc/genpark-multi-armed-bandit-ucb1-thompson-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-multi-armed-bandit-ucb1-thompson-skill/issues"
